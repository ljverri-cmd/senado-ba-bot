name: Monitoreo Diario Senado PBA

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 09:00 AM (Hora Argentina)
    - cron: '0 12 * * *'
  workflow_dispatch: # <--- Esto habilita el botón "Run workflow" manualmente

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests beautifulsoup4 playwright
          playwright install chromium

      - name: Ejecutar Bot de Monitoreo
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python -u bot.py
