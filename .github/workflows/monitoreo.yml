name: Monitoreo Diario Senado PBA

on:
  schedule:
    - cron: '0 12 * * *' # Se ejecuta todos los días a las 09:00 hs (Argentina)
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga los archivos del repositorio
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      # 2. Configura el entorno Python (usando la versión v5 compatible con Node.js actualizado)
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instala librerías y navegadores de Playwright
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client playwright
          playwright install --with-deps chromium

      # 4. Ejecuta el script del bot
      - name: Ejecutar Bot de Monitoreo
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python bot.py
